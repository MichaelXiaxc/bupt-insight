# BUPT Insight 配置模板（仅 BYR 论坛信息源）
#
# 复制为 config.yaml 后修改。密码不写在这里：运行
#     python -X utf8 run.py credentials save
# 会把账号密码加密保存到 paths.secrets_dir 下的密文文件。

owner:
  tz: Asia/Shanghai            # 影响“今天/近30天”等判断，服务器请保持一致

site:
  title: BUPT Insight
  # 对外访问地址，用于生成通知里的链接；HTTPS 时 cookie 自动带 Secure。
  base_url: https://insight.example.com
  # 允许的 Host 头（防 DNS rebinding）。填实际域名；127.0.0.1/localhost 始终允许。
  allowed_hosts:
    - insight.example.com
  # 由 base_url 推断；明文 HTTP 本地调试时可显式设为 false
  cookie_secure: null

server:
  host: 127.0.0.1             # 只监听本机，由 nginx 反代；不要改成 0.0.0.0
  port: 8000

net:
  browser: chrome             # chrome / chromium / edge；也可用 executable_path 指定
  executable_path: ""         # 例如 /opt/google/chrome/chrome
  timeout_ms: 30000
  retries: 2
  delay_ms: 2500              # 请求间隔，别调太低
  args: []                    # 额外 Chromium 参数，例如 ["--disable-dev-shm-usage"]

paths:
  # 生产建议放到仓库外的绝对路径，例如 /var/lib/bupt-insight
  data_dir: .local/data
  session_dir: .local/sessions
  inbox_dir: .local/inbox
  secrets_dir: .local/secrets # 0700；与 config.yaml 分离，且不在版本控制内

sources:
  byr:
    enabled: true
    base: https://bbs.byr.cn
    requires_login: true
    private: false            # 若关注私人版面，设 true，禁止把正文发往第三方
    watchlist: watchlist.json
    boards: [Paper, ML_DM, Robot, SICE, ParttimeJob, MathModel, Innovation, ACM_ICPC, AcademicAffairs, SCS]
    rows_per_board: 10
    board_overrides:
      Paper: {pages: 3, rows_per_page: 30}
    # 留空则使用 paths.secrets_dir 下的默认文件名
    credentials_file: ""      # 默认 <secrets_dir>/byr.enc
    session_file: ""          # 默认 <secrets_dir>/byr-state.enc
    master_key_file: ""       # 默认 <secrets_dir>/master.key（也可用环境变量注入）

push:
  retries: 3
  channels:
    # 通用 Webhook：JSON POST {"title","body","url"}
    webhook: {enabled: false, url: ""}
    # ntfy：手机推送，可自建；topic 相当于频道口令
    ntfy: {enabled: false, server: https://ntfy.sh, topic: "", token: ""}
    # 微信通道（可选）
    pushplus: {enabled: false}
    serverchan: {enabled: false}

backup:
  enabled: true
  interval_hours: 24
  keep: 7

health:
  stale_hours: 24

ai:
  mode: "off"                 # off=不调用模型；mock=模拟；api=OpenAI 兼容接口
  base_url: ""
  model: ""
  response_format: json_schema
  timeout_seconds: 8
  retries: 1
  budget_seconds: 12
  max_per_run: 20
  max_input_chars: 6000
  allow_private_cloud: false
  allow_profile_cloud: false

smart:
  enabled: false              # 开启后用本地规则/AI 决定即时提醒或汇总
